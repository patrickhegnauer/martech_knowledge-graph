[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "martech-knowledge-graph"
version = "0.1.2"
description = "A maintenance UI + local API for a martech knowledge graph (RDFS ontology in Turtle, queried with SPARQL)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdflib",
    "flask",
    "fastmcp",
]

[project.scripts]
martech-knowledge-graph = "martech_knowledge_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
martech_knowledge_graph = [
    "ontology/*.ttl",
    "examples/*.ttl",
    "ui/*.html",
    "ui/*.md",
    "ui/css/*.css",
    "ui/js/*.js",
    "ui/vendor/*",
]
